<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS Reset -->
    <link rel="stylesheet" href="/css/reset.css">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/cadastro.css">
    <title>Cadastro de Enfermeiros</title>
</head>
<body>
    <main class="main-cadastro">
        <section class="header-section">
            <img src="/assets/img/gerenciador.png" alt="logo">
            <h1>Dados</h1>
        </section>
        <section class="form-section">
            <form class="cadastro-form" data-tipo="medico">
                <div>
                    <div class="input-box">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="input-box">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" required>
                    </div>
                </div>

                <div>
                    <div class="input-box">
                        <label for="dtNascimento">Data de Nascimento:</label>
                        <input type="date" id="dtNascimento" name="dtNascimento" required>
                    </div>
                    <div class="input-box">
                        <label for="genero">Gênero:</label>
                        <select id="genero" name="genero" required>
                            <option value="">Selecione</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Feminino">Outro</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div class="input-box">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" required>
                    </div>
                    <div class="input-box">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
    
                <div>
                    <div class="input-box">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>
                    <div class="input-box">
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                </div>
    
                <div>
                    <div class="input-box">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                    <div class="input-box">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" required>
                    </div>
                </div>

                <div>
                    <div class="input-box">
                        <label for="especialidade">Especialidade:</label>
                        <input type="text" id="especialidade" name="especialidade" required>
                    </div>
                    <div class="input-box">
                        <label for="crm">CRM:</label>
                        <input type="text" id="crm" name="crm" required>
                    </div>
                </div>

                <div>
                    <div class="input-box">
                        <label for="setor">Setor:</label>
                        <input type="text" id="setor" name="setor" required>
                    </div>
                    <div class="input-box">
                        <label for="turno">Turno:</label>
                        <input type="text" id="turno" name="turno" required>
                    </div>
                </div>

                <button type="submit">CADASTRAR</button>
            </form>
        </section>
    </main>
    
    <script type="module" src="../../script/cadastros.js"></script>
</body>
</html>
